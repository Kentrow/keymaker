name: Scorecard

# The OpenSSF Scorecard grades the practices around the code: pinned dependencies, branch
# protection, token permissions, signed releases, and so on. Publishing the result lets a
# visitor check those rather than take them on trust, and the badge in the README points at it.
#
# To be allowed to publish, the workflow keeps to what Scorecard accepts: no top-level env or
# defaults, no container or service, and only the actions it lists as approved.

on:
  push:
    branches: [main]
  schedule:
    - cron: "41 5 * * 1"
  branch_protection_rule:
  workflow_dispatch:

permissions: read-all

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    # security-events: write uploads the findings to code scanning; id-token: write signs the
    # result that is published to the Scorecard API.
    permissions:
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5

      - uses: github/codeql-action/upload-sarif@24c54180a607b1449ed407dd24f251e4e9147c8d # v4.38.3
        with:
          sarif_file: results.sarif
